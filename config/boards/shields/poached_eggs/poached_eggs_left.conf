CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y
CONFIG_BT_DEVICE_NAME="poached-eggs"

# --- Prospector Scanner (Status Advertisement) ---
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="poached-eggs"
CONFIG_ZMK_STATUS_ADV_CENTRAL_SIDE="LEFT"

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Right と Nape の2台を接続する
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# Right と Nape の両方が接続するまで、接続待ちを優先する
CONFIG_PROSPECTOR_EXPECTED_PERIPHERAL_COUNT=2

# Prospector のバッテリー表示：Right は0番、Napeは1番
CONFIG_ZMK_STATUS_ADV_HALF_PERIPHERAL=0
CONFIG_ZMK_STATUS_ADV_AUX1_PERIPHERAL=1
